# Baut die Firmware mit ESP-IDF für alle Board-Varianten und veröffentlicht sie.
#   Push auf main, Pull Request -> bauen, .bin-Dateien als Artefakt am Workflow-Lauf
#   Tag v1.2.3                  -> zusätzlich GitHub-Release mit den .bin-Dateien
#                                  und Web-Flasher auf GitHub Pages aktualisieren
#   Tag v1.2.3-alpha.1          -> Vorab-Release (nicht "latest"), im Web-Flasher als Kanal "Alpha" wählbar
name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IDF_VERSION: v6.1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # Tags für git describe
      - id: version
        run: |
          # v1.2.3 -> 1.2.3, zwischen Releases z. B. 1.2.3-4-gabc1234
          VERSION=$(git describe --tags --always)
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [n16r8, basic]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Bauen (${{ matrix.variant }})
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          extra_docker_args: -e UPRINT_VERSION=${{ env.VERSION }}
          command: >-
            idf.py -DUPRINT_VARIANT=${{ matrix.variant }} -B build build &&
            idf.py -DUPRINT_VARIANT=${{ matrix.variant }} -B build merge-bin -o uprint-factory.bin

      - name: Dateien sammeln
        run: |
          mkdir dist
          # OTA-Update über die Weboberfläche
          cp build/uprint.bin "dist/uprint-$VERSION-${{ matrix.variant }}-ota.bin"
          # Erstinstallation ab Adresse 0x0 (Bootloader, Partitionstabelle, App)
          cp build/uprint-factory.bin "dist/uprint-$VERSION-${{ matrix.variant }}-factory.bin"

      - uses: actions/upload-artifact@v7
        with:
          name: uprint-${{ env.VERSION }}-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: uprint-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.bin
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Der Web-Flasher bietet zwei Kanäle: "stable" (neuestes normales Release) und "alpha" (neuestes
  # Vorab-Release, nur solange es jünger ist als das stabile). Da GitHub Pages bei jedem Deploy die ganze
  # Seite ersetzt, werden bei jedem Tag beide Kanäle aus den Releases neu zusammengestellt.
  flasher:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Seite zusammenstellen
        run: |
          mkdir -p site/fonts
          cp flasher/index.html site/
          cp main/www/fonts/*.woff2 main/www/fonts/OFL-*.txt site/fonts/
          STABLE=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName // ""')
          # Neuestes Release überhaupt; nur wenn das ein Vorab-Release ist, gibt es einen Alpha-Kanal
          ALPHA=$(gh release list --exclude-drafts --limit 1 --json tagName,isPrerelease -q '.[0] | select(.isPrerelease) | .tagName')
          echo '{}' > site/channels.json
          for ch in stable alpha; do
            if [ "$ch" = stable ]; then tag=$STABLE; else tag=$ALPHA; fi
            [ -n "$tag" ] || continue
            version=${tag#v}
            mkdir -p "dl/$ch" "site/firmware/$ch"
            gh release download "$tag" -p '*-factory.bin' -D "dl/$ch"
            # Je Variante ein Image und ein Manifest für ESP Web Tools
            for v in n16r8 basic; do
              cp "dl/$ch/uprint-$version-$v-factory.bin" "site/firmware/$ch/uprint-$v-factory.bin"
              cat > "site/manifest-$ch-$v.json" <<EOF
          {
            "name": "µprint ($v)",
            "version": "$version",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32-S3", "parts": [{ "path": "firmware/$ch/uprint-$v-factory.bin", "offset": 0 }] }
            ]
          }
          EOF
            done
            jq --arg ch "$ch" --arg v "$version" '. + {($ch): $v}' site/channels.json > channels.tmp
            mv channels.tmp site/channels.json
          done
          cat site/channels.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
