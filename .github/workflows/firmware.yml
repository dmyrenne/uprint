# Baut die Firmware mit ESP-IDF für alle Board-Varianten und veröffentlicht sie.
#   Push auf einen Branch        -> Vorab-Release v1.2.3-alpha.N (nicht "latest"), im Web-Flasher unter "Alpha",
#                                   damit sich der Stand testen lässt, bevor er in main liegt
#   Pull Request in main gemergt -> Release v1.2.3, die Alphas des Branches werden entfernt
#   Tag v1.2.3 (von Hand)        -> Release zu diesem Tag
#   sonst (direkter Push auf main, workflow_dispatch) -> nur bauen, .bin-Dateien als Artefakt am Workflow-Lauf
# Releases gibt es nur, wenn sich die Firmware ändert (main/, CMake, sdkconfig, Partitionen). Die nächste
# Version ist die letzte stabile mit erhöhter Patch-Nummer, mit Label "minor" bzw. "major" am Pull Request
# entsprechend höher. Den Web-Flasher baut danach flasher.yml aus allen Releases neu.
name: Firmware

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IDF_VERSION: v6.1

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      title: ${{ steps.version.outputs.title }}
      branch: ${{ steps.version.outputs.branch }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # Tags und main für Version und Änderungsprüfung
      - id: version
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          # Standard: nur bauen, Version z. B. 1.2.3-4-gabc1234
          VERSION=$(git describe --tags --always)
          out version "${VERSION#v}"
          out release false
          out prerelease false

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            out version "${GITHUB_REF_NAME#v}"
            out release true
            out prerelease "$([[ $GITHUB_REF_NAME == *-* ]] && echo true || echo false)"
            out title "$GITHUB_REF_NAME"
            exit 0
          fi
          [ "$GITHUB_EVENT_NAME" = push ] || exit 0

          if [ "$GITHUB_REF_NAME" = main ]; then
            # Nur Merges von Pull Requests werden zum Release
            PR=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" -q '[.[] | select(.merged_at != null)][0] // empty')
            if [ -z "$PR" ]; then echo "Kein gemergter Pull Request, nur bauen"; exit 0; fi
            BRANCH=$(jq -r .head.ref <<<"$PR")
            LABELS=$(jq -r '.labels[].name' <<<"$PR")
            BASE=$(git rev-parse HEAD^1)
          else
            BRANCH=$GITHUB_REF_NAME
            LABELS=$(gh pr list --head "$BRANCH" --state open --json labels -q '.[0].labels[]?.name' || true)
            BASE=$(git merge-base origin/main HEAD)
          fi
          if git diff --quiet "$BASE" HEAD -- main CMakeLists.txt dependencies.lock 'sdkconfig.defaults*' 'partitions-*.csv'; then
            echo "Firmware unverändert gegenüber main, nur bauen"; exit 0
          fi

          # Nächste Version aus der letzten stabilen
          LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- - | head -1)
          IFS=. read -r MA MI PA <<<"${LAST#v}"
          if grep -qx major <<<"$LABELS"; then NEXT="$((MA + 1)).0.0"
          elif grep -qx minor <<<"$LABELS"; then NEXT="$MA.$((MI + 1)).0"
          else NEXT="$MA.$MI.$((PA + 1))"; fi

          if [ "$GITHUB_REF_NAME" = main ]; then
            VERSION=$NEXT
            out prerelease false
            out title "v$VERSION"
          else
            # Alphas zählen über alle Branches hoch, der Branch steht im Titel
            N=$(git tag -l "v$NEXT-alpha.*" | sed 's/.*-alpha\.//' | sort -n | tail -1)
            VERSION="$NEXT-alpha.$((${N:-0} + 1))"
            out prerelease true
            out title "v$VERSION · $BRANCH"
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION gibt es schon"; exit 1
          fi
          echo "Release v$VERSION (Branch $BRANCH, nach $LAST)"
          out version "$VERSION"
          out release true
          out branch "$BRANCH"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [n16r8, basic]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Bauen (${{ matrix.variant }})
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          extra_docker_args: -e UPRINT_VERSION=${{ env.VERSION }}
          command: >-
            idf.py -DUPRINT_VARIANT=${{ matrix.variant }} -B build build &&
            idf.py -DUPRINT_VARIANT=${{ matrix.variant }} -B build merge-bin -o uprint-factory.bin

      - name: Dateien sammeln
        run: |
          mkdir dist
          # OTA-Update über die Weboberfläche
          cp build/uprint.bin "dist/uprint-$VERSION-${{ matrix.variant }}-ota.bin"
          # Erstinstallation ab Adresse 0x0 (Bootloader, Partitionstabelle, App)
          cp build/uprint-factory.bin "dist/uprint-$VERSION-${{ matrix.variant }}-factory.bin"

      - uses: actions/upload-artifact@v7
        with:
          name: uprint-${{ env.VERSION }}-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write          # flasher.yml anstoßen
    # Versionsnummern nicht parallel vergeben
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      BRANCH: ${{ needs.version.outputs.branch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: uprint-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.title }}
          files: dist/*.bin
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}

      # Aus den Alphas ist jetzt ein Release geworden
      - name: Alphas des Branches entfernen
        if: github.ref_name == 'main' && env.BRANCH != ''
        run: |
          gh release list --exclude-drafts --limit 100 --json tagName,name,isPrerelease \
            -q ".[] | select(.isPrerelease and (.name | endswith(\" · $BRANCH\"))) | .tagName" |
          while read -r tag; do
            echo "Entferne $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done

      # Pages darf nur von main aus veröffentlichen, deshalb läuft der Flasher als eigener Workflow auf main
      - name: Web-Flasher aktualisieren
        run: gh workflow run flasher.yml --ref main
