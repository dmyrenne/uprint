<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>µprint</title>
<link rel="icon" id="favicon" href="data:,">
<style>
  /* Schriften liegen im Firmware-Image unter /fonts (SIL Open Font License), damit alles auch ohne Internet läuft */
  @font-face { font-family: 'Space Grotesk'; src: url(fonts/space-grotesk.woff2) format('woff2'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono.woff2) format('woff2'); font-weight: 100 800; font-display: swap; }
  :root {
    --sans: 'Space Grotesk', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
    --bg: #f3f4f6; --panel: #ffffff; --field: #ffffff; --ink: #0c0d10; --muted: #71737c; --line: #e3e4e8; --line-strong: #c9cbd2;
    --accent: #2340ff; --accent-soft: #e8ebff; --accent-ink: #ffffff; --warn: #d4380d; --warn-bg: #fff1eb;
    --hold: #9a5b00; --hold-bg: #fff4dc;
    --dot: #d9dbe1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c0f; --panel: #121318; --field: #0b0c0f; --ink: #eceef3; --muted: #8b8e99; --line: #23252d; --line-strong: #353843;
      --accent: #7187ff; --accent-soft: #1b2146; --accent-ink: #0b0c0f; --warn: #ff8a66; --warn-bg: #2d1710;
      --hold: #ffb547; --hold-bg: #2b2010;
      --dot: #1e2027;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 var(--sans); background: var(--bg); color: var(--ink);
         min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--accent); }

  /* ---------- Kopfzeile ---------- */
  .top { display: flex; align-items: center; gap: 12px 32px; padding: 12px 24px; background: var(--panel);
         border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand svg { width: 36px; height: 36px; border-radius: 9px; background: var(--ink); cursor: pointer; flex: none; }
  h1 { font-size: 22px; line-height: 1; margin: 0; font-weight: 700; letter-spacing: -.03em; min-width: 0; }
  #devName { display: block; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h1 small { display: block; white-space: nowrap; font: 500 10px/1.3 var(--mono); letter-spacing: .02em; color: var(--muted); margin-top: 4px; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat b { display: block; font: 600 18px/1.2 var(--mono); letter-spacing: -.02em; white-space: nowrap; }
  .stat span { font-size: 11px; color: var(--muted); }
  .spacer { flex: 1; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .head-right select { width: auto; padding: 4px 8px; font-size: 12px; }

  /* ---------- Inhalt ---------- */
  main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 20px 24px 12px; counter-reset: sec;
         display: flex; flex-direction: column; gap: 16px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 20px; min-width: 0; }
  /* Spalten wachsen unabhängig voneinander: eine lange Dateiliste schiebt WLAN und Einstellungen nicht nach unten */
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  h2, details summary { display: flex; align-items: baseline; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: -.01em;
       margin: 0 0 14px; color: var(--ink); }
  h2::before, details summary::before { counter-increment: sec; content: counter(sec, decimal-leading-zero);
       font: 500 11px var(--mono); color: var(--accent); }
  details.card { padding-bottom: 18px; }
  /* Kopfzeile reicht bis an den Kartenrand, damit die ganze (geschlossene) Karte klickbar ist */
  details summary { cursor: pointer; list-style: none; margin: -18px -20px; padding: 18px 20px; }
  details[open] summary { margin-bottom: -4px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: '+'; margin-left: auto; font: 400 16px var(--mono); color: var(--muted); }
  details[open] summary::after { content: '−'; }
  #messages:empty { display: none; }

  /* Druckerstatus im Kopf: blau, sobald ein Drucker verbunden ist */
  .tab { display: inline-flex; align-items: center; gap: 6px; font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .04em;
         padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }
  .tab::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tab.wait { border-color: var(--accent); color: var(--accent); }
  .tab.bad { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
  .tab.hold { background: var(--hold-bg); border-color: transparent; color: var(--hold); }
  .tab.busy::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .drop { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 14px;
          text-align: center; cursor: pointer; color: var(--muted); transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .drop strong { color: var(--ink); display: block; word-break: break-all; font-weight: 600; font-size: 15px; }
  .drop.disabled { opacity: .45; pointer-events: none; }
  .upload .drop { min-height: 76px; display: flex; flex-direction: column; justify-content: center; }
  #targetRow { margin-bottom: 10px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; align-items: end; }
  .full { grid-column: 1 / -1; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 9px; color: var(--ink); font-size: 13px; cursor: pointer; }
  input[type=text], input[type=password], input[type=search], select {
         font: 400 14px var(--sans); color: var(--ink); background: var(--field); border: 1px solid var(--line-strong);
         border-radius: 6px; padding: 6px 8px; width: 100%; transition: border-color .15s, box-shadow .15s; }
  input[type=password] { font-family: var(--mono); font-size: 13px; }
  input:focus-visible, select:focus-visible, button:focus-visible, .drop:focus-visible {
         outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  button { font: 500 13px var(--sans); border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
           border-radius: 99px; padding: 6px 14px; cursor: pointer; transition: border-color .15s, background .15s, color .15s; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.warn:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); }
  button.small { padding: 3px 10px; font-size: 12px; }
  button:disabled { opacity: .35; cursor: default; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  /* Speichern/Verwerfen: bei ungespeicherten Änderungen am unteren Rand, damit man sie nicht übersieht.
     Sticky direkt vor dem Footer: klebt beim Scrollen unten und liegt am Seitenende über dem Footer, nie darunter */
  .set-actions { margin-top: 12px; }
  .set-actions .unsaved { display: none; }
  .set-actions.floating { position: sticky; z-index: 20; bottom: 16px; align-self: center; margin: 0 16px 8px;
    width: max-content; max-width: calc(100% - 32px); padding: 10px 12px 10px 16px; gap: 10px;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); }
  .set-actions.floating .unsaved { display: inline; font-size: 13px; font-weight: 600; margin-right: 6px; }
  @media (max-width: 600px) {
    .set-actions.floating { align-self: stretch; bottom: 12px; margin: 0 12px 8px; width: auto; max-width: none; }
    .set-actions.floating .unsaved { flex: 1 0 100%; margin: 0; }
  }
  .pick { display: flex; gap: 6px; }
  .pick select { flex: 1; min-width: 0; }
  .pick input { flex: 1; min-width: 0; }
  .pick button { white-space: nowrap; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .hint.bad { color: var(--warn); }
  .derived { font-size: 12px; background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
  .derived b, .derived a { font: 600 12px var(--mono); color: var(--accent); }
  .derived.bad { background: var(--warn-bg); color: var(--warn); }
  .derived.bad b { color: inherit; }
  .derived div + div { margin-top: 4px; }
  /* Einrichtung über das Captive Portal: nur die WLAN-Karte */
  body:not(.setup) .setup-only, body.setup .no-setup { display: none !important; }
  body.setup main > :not(#setupSlot):not(#messages), body.setup .foot, body.setup .stats { display: none; }
  #setupSlot { max-width: 560px; margin: 0 auto; width: 100%; }
  /* Anmeldung bzw. Passwort festlegen (#31): steht allein auf der Seite, bis es erledigt ist */
  body.gate main > :not(#authBox):not(#messages), body.gate .foot, body.gate .stats { display: none; }
  #authBox { max-width: 440px; margin: 0 auto; width: 100%; }
  #authBox .row { margin-top: 4px; }
  body.setup #wifiBox summary { cursor: default; }
  body.setup #wifiBox summary::after, body.setup #wifiForget, body.setup #wifiHint { display: none; }
  .handoff { font-size: 14px; }
  .handoff .count { font: 600 28px var(--mono); color: var(--accent); }
  .addr { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .addr code { flex: 1; font: 600 14px var(--mono); background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; }

  .bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  .vols { display: grid; gap: 6px; margin-bottom: 8px; }
  .vol { display: grid; grid-template-columns: 64px 1fr auto auto; gap: 10px; align-items: center; font-size: 12px; }
  .vol button { padding: 1px 8px; font-size: 11px; }
  .wipe { margin: 4px 0 10px; }
  .wipe .row { margin-top: 8px; }
  .wipe label.check { margin-top: 8px; font-size: 12px; }
  .vol .meter { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .vol .meter i { display: block; height: 100%; width: 0; background: var(--ink); }
  .vol .meter i.bad { background: var(--warn); }   /* nicht verfügbar oder ab 90 % belegt */
  .vol .free { font: 500 11px var(--mono); color: var(--muted); }
  .vol .free.bad { color: var(--warn); }
  .vol.off { color: var(--muted); }
  input.search { margin: 6px 0 8px; }

  /* Eigener Scrollbereich; die Zeilen reichen trotzdem bis an den Kartenrand */
  .files { list-style: none; margin: 0 -10px; padding: 0; max-height: 60vh; overflow-y: auto; overscroll-behavior: contain; }
  .files li { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-top: 1px solid var(--line);
              border-radius: 8px; cursor: pointer; transition: background .15s; }
  .files li:hover { background: var(--bg); }
  .files li.sel { background: var(--accent-soft); }
  .files li.sel, .files li.sel + li { border-top-color: transparent; }
  .files li.sel .name { color: var(--accent); font-weight: 600; }
  .files li.sel .tag { background: var(--panel); }
  .files li:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
  .files li .info { flex: 1; min-width: 0; }
  .files li .name { display: block; overflow-wrap: anywhere; }
  .files li .meta { display: flex; align-items: center; gap: 6px; font: 500 11px var(--mono); color: var(--muted); margin-top: 2px; }
  .files li.empty { color: var(--muted); font-size: 13px; cursor: default; }
  .files li.empty:hover { background: none; }
  .files li.active .name { color: var(--accent); font-weight: 600; }
  .files li .tag.bad { background: var(--warn-bg); color: var(--warn); }
  /* SVG aus µplot: Vorschau der Fahrwege auf der Zeichenfläche */
  .svg-prev { display: block; width: 100%; max-height: 280px; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 8px;
              background: var(--bg); }
  .svg-prev .area { fill: var(--panel); }
  .svg-prev .page { fill: none; stroke: var(--line-strong); stroke-dasharray: 4 3; }
  .svg-prev .draw { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
  .badge { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 99px;
           background: var(--warn-bg); color: var(--warn); white-space: nowrap; }
  .sub { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 -4px; }
  .sub:first-child { margin-top: 0; }
  .grid .hint { margin: 0; }
  input[type=number] { font: 500 13px var(--mono); color: var(--ink); background: var(--field); border: 1px solid var(--line-strong);
         border-radius: 6px; padding: 6px 8px; width: 100%; transition: border-color .15s, box-shadow .15s; }
  .tag { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px; border-radius: 99px;
         background: var(--accent-soft); color: var(--accent); }

  /* ---------- Druck ---------- */
  .print-body { display: flex; gap: 20px; align-items: stretch; }
  .anim { flex: none; align-self: flex-start; width: 150px; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 10px; padding: 12px;
          background: radial-gradient(circle, var(--dot) 1px, transparent 1.2px) 0 0 / 12px 12px, var(--bg); }
  .anim svg { width: 100%; height: 100%; overflow: visible; }
  .anim .done { stroke: var(--ink); stroke-width: 2.4; }
  .anim .cur { stroke: var(--accent); stroke-width: 3.6; }
  .anim .todo { stroke: var(--line-strong); stroke-width: 1.4; stroke-dasharray: 2 4; }
  .anim .nozzle { fill: var(--accent); }
  /* Aufheizen: Düse steht über dem Bett, das Bett füllt sich mit der Temperatur, darüber steigt Wärme auf */
  .anim .heat .nozzle { fill: var(--warn); }
  .anim .bed { stroke: var(--warn); stroke-width: 3.6; }
  .anim .waft { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-linecap: round; opacity: 0; animation: waft 2.4s ease-out infinite; }
  @keyframes waft { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-22px); } }
  /* Drucker – Kabel – µprint, wenn kein Drucker verbunden ist */
  .anim.illu { width: 300px; aspect-ratio: 2 / 1; }
  .illu .frame { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .illu .thin { fill: none; stroke: var(--muted); stroke-width: 1.1; stroke-linecap: round; }
  .illu .solid { fill: var(--bg); }
  .illu .layer { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
  .illu .cable { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; }
  .illu .cut { stroke: var(--warn); stroke-width: 2.4; stroke-linecap: round; }
  .illu .mu { fill: var(--ink); font: 700 30px var(--sans); }
  .illu .led { fill: var(--warn); }
  .illu .art { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .illu .pen { fill: var(--accent); }
  .illu.wait .cable { stroke: var(--accent); stroke-dasharray: 3 5; animation: flow 1s linear infinite; }
  .illu.wait .led { fill: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .illu.wait .x { display: none; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  .print-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .job-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; overflow-wrap: anywhere; }
  .job-sub { font: 500 12px var(--mono); color: var(--muted); margin-top: 4px; }
  .job-sub.bad { color: var(--warn); }
  .job-sub.done { color: var(--accent); font-weight: 600; }
  .job-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #apiKey { font: 500 12px var(--mono); }
  .hint code { font: 500 11px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .ota { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .ota .sub { margin: 0 0 6px; }
  .ota-name { font: 500 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .bar.big { height: 8px; margin-top: 14px; }
  .job-meta { display: flex; justify-content: space-between; gap: 12px; font: 500 12px var(--mono); color: var(--muted); margin-top: 6px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 16px; }
  button.big { font-size: 15px; font-weight: 600; padding: 10px 24px; }
  button.danger { color: var(--warn); }
  button.danger:hover:not(:disabled) { border-color: var(--warn); background: var(--warn-bg); }

  /* Während eines Drucks gesperrt (#16): sichtbar, aber nicht bedienbar */
  [inert] { opacity: .5; }
  .lock-note { margin: 0 0 12px; }
  .host-prompt { margin: 12px 0 0; font-size: 13px; }

  /* ---------- Status-LEDs ---------- */
  .led-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--line-strong); }
  body.leds main > :not(#ledsView):not(#messages) { display: none; }
  .leds-view { max-width: 920px; width: 100%; margin: 0 auto; }
  .leds-view .back, .log-view .back { font-size: 13px; display: inline-block; margin-bottom: 12px; }
  .led-rows { margin: 8px -6px 0; }
  .led-row { display: grid; grid-template-columns: minmax(130px, 1.2fr) 44px minmax(140px, 1.2fr) minmax(150px, 1fr) auto; gap: 8px 12px;
             align-items: center; padding: 9px 6px; border-top: 1px solid var(--line); }
  .led-row .name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .led-row .name small { font: 500 10px var(--mono); color: var(--muted); }
  .led-row.unsaved { background: var(--accent-soft); border-radius: 8px; border-top-color: transparent; }
  .led-row .bright { display: flex; flex-direction: row; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--muted); }
  .led-row .bright span { width: 38px; text-align: right; }
  input[type=color] { width: 44px; height: 30px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--field); cursor: pointer; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .led-row .noop { visibility: hidden; }
  .led-paint { margin-top: 10px; align-items: flex-end; }
  .led-paint .brush { flex-direction: row; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .led-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; margin-top: 12px;
              padding: 10px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px;
              touch-action: none; user-select: none; }
  .led-grid.unsaved { box-shadow: 0 0 0 2px var(--accent); }
  .led-grid i { aspect-ratio: 1; border-radius: 50%; cursor: crosshair; position: relative;
                box-shadow: inset 0 0 0 1px var(--line-strong); }
  .led-grid i span { position: absolute; inset: auto 0 -1px; text-align: center; font: 500 8px var(--mono);
                     color: #fff; mix-blend-mode: difference; pointer-events: none; }
  .led-interval { margin-top: 14px; max-width: 320px; }
  .leds-actions { margin-top: 16px; }
  .leds-actions .spacer { flex: 1; }
  @media (max-width: 700px) {
    .led-row { grid-template-columns: 1fr 44px; }
    .led-row select, .led-row .bright { grid-column: 1 / -1; }
  }

  .axi-prompt { font-size: 15px; font-weight: 600; margin-top: 14px; }
  .axi-log { font: 500 11px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
             margin: 14px 0 0; max-height: 280px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* ---------- Unterseite #log (#36) ---------- */
  body.log main > :not(#logView):not(#messages) { display: none; }
  .log-view { max-width: 1200px; width: 100%; margin: 0 auto; }
  .log-tools { align-items: flex-end; margin-top: 10px; }
  .log-tools .spacer { flex: 1; }
  .log-text { font: 500 11px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
              padding: 8px 10px; margin: 14px 0 0; height: 65vh; min-height: 240px; overflow: auto; white-space: pre-wrap;
              overflow-wrap: anywhere; }
  .log-text .e { color: var(--warn); }
  .log-text .w { color: #b7791f; }
  .log-text .s { color: var(--muted); }
  .log-text .b { color: var(--accent); font-weight: 600; }
  .axi-obs { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .axi-obs textarea { font: 13px var(--sans, inherit); color: var(--ink); background: var(--field); border: 1px solid var(--line-strong);
                      border-radius: 6px; padding: 7px 9px; resize: vertical; }
  .msg { padding: 8px 11px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); white-space: pre-wrap; font-size: 13px; }
  .msg.ok { background: var(--accent-soft); color: var(--ink); }
  .foot { width: 100%; max-width: 1180px; margin: 0 auto; padding: 4px 24px 24px; font-size: 12px; color: var(--muted); text-align: center; }

  /* Großer Bildschirm: die Seite passt in den Viewport, Dateiliste und rechte Spalte scrollen für sich.
     Bei geringerer Höhe scrollt die Seite normal, die Dateiliste ist dann auf 60 % der Höhe begrenzt. */
  @media (min-width: 861px) and (min-height: 900px) {
    body { height: 100vh; height: 100dvh; min-height: 0; }
    main { min-height: 0; }
    .cols { flex: 1; min-height: 0; align-items: stretch; }
    /* Reicht die Höhe selbst für die Mindesthöhe der Dateiliste nicht, scrollt die ganze Spalte */
    .col { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .files-card { flex: 1 0 0; min-height: 280px; display: flex; flex-direction: column; }
    .files { flex: 1; min-height: 0; max-height: none; }
    .foot { padding-bottom: 16px; }
  }
  @media (max-width: 860px) {
    .top { padding: 12px 16px; gap: 12px; }
    .stats { order: 3; width: 100%; gap: 10px 20px; }
    .stat b { font-size: 16px; }
    main { padding: 16px; }
    .cols { grid-template-columns: 1fr; }
    .foot { padding: 4px 16px 20px; }
    .anim { width: 88px; padding: 8px; }
    .anim.illu { width: 100%; max-width: 300px; }
    .print-body { gap: 14px; flex-wrap: wrap; }
    .print-main { min-width: 180px; }
    .job-title { font-size: 18px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg id="mark" viewBox="0 0 34 34" role="img" aria-label="µprint"></svg>
    <h1><span id="devName">µprint</span><small id="tagline" data-i18n="tagline"></small></h1>
    <span class="led-dot" id="ledDot" data-i18n-aria="leds.dot" hidden></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <div class="head-right">
    <select id="lang" data-i18n-aria="lang"></select>
    <span class="tab" id="tab"></span>
  </div>
</header>

<main>
  <div id="messages"></div>
  <div id="setupSlot"></div>
  <section class="card" id="authBox" hidden>
    <h2 id="authTitle"></h2>
    <p class="hint" id="authIntro" style="margin:0 0 14px"></p>
    <form id="authForm" class="grid">
      <label class="full"><span id="authPassLabel"></span><input type="password" id="authPass" maxlength="63" required></label>
      <label class="full" id="authRepRow"><span data-i18n="auth.repeat"></span><input type="password" id="authRep" maxlength="63" autocomplete="new-password"></label>
      <label class="check full" id="authApRow"><input type="checkbox" id="authAp" checked> <span data-i18n="auth.ap"></span></label>
      <div class="row full"><button type="submit" class="primary" id="authBtn"></button><button type="button" id="authSkip" data-i18n="auth.skip"></button></div>
      <p class="hint full" id="authSkipHint" data-i18n="auth.skip.hint"></p>
    </form>
  </section>

  <!-- Unterseite #leds: Darstellung der Status-LEDs je Zustand -->
  <section class="card leds-view" id="ledsView" hidden>
    <a class="back" href="#" data-i18n="leds.back"></a>
    <h2 data-i18n="leds.title"></h2>
    <p class="derived lock-note" data-i18n="lock.print" hidden></p>
    <p class="hint" data-i18n="leds.intro"></p>
    <div class="led-rows" id="ledRows"></div>
    <p class="sub" style="margin-top:20px" data-i18n="leds.id"></p>
    <p class="hint" data-i18n="leds.id.hint"></p>
    <div class="row led-paint" id="ledPaint">
      <label class="brush"><span data-i18n="leds.brush"></span><input type="color" id="ledBrush"></label>
      <button type="button" class="small" id="ledFill" data-i18n="leds.fill"></button>
      <button type="button" class="small" id="ledPatternDefault" data-i18n="leds.pattern.default"></button>
    </div>
    <div class="led-grid" id="ledGrid"></div>
    <p class="hint" id="ledGridHint"></p>
    <label class="led-interval" id="ledIntervalRow"><span data-i18n="leds.interval"></span><select id="ledInterval"></select></label>
    <div class="row leds-actions">
      <button type="button" class="primary" id="ledSave" data-i18n="save"></button>
      <button type="button" id="ledRevert" data-i18n="revert"></button>
      <button type="button" id="ledFind2" data-i18n="leds.find"></button>
      <span class="spacer"></span>
      <button type="button" class="warn" id="ledReset" data-i18n="leds.reset"></button>
    </div>
  </section>

  <!-- Unterseite #log: Live-Log und Diagnose (#36) -->
  <section class="card log-view" id="logView" hidden>
    <a class="back" href="#" data-i18n="leds.back"></a>
    <h2 data-i18n="log.title"></h2>
    <p class="hint" data-i18n="log.intro"></p>
    <div class="row log-tools">
      <label><span data-i18n="log.serial"></span><select id="logSerial">
        <option value="0" data-i18n="log.serial.0"></option><option value="1" data-i18n="log.serial.1"></option>
        <option value="2" data-i18n="log.serial.2"></option>
      </select></label>
      <label><span data-i18n="log.filter"></span><select id="logFilter">
        <option value="all" data-i18n="log.filter.all"></option><option value="printer" data-i18n="log.filter.printer"></option>
        <option value="warn" data-i18n="log.filter.warn"></option>
      </select></label>
      <label class="check"><input type="checkbox" id="logFollow" checked> <span data-i18n="log.follow"></span></label>
      <span class="spacer"></span>
      <button type="button" class="small" id="logPause" data-i18n="log.pause"></button>
      <button type="button" class="small" id="logDiag" data-i18n="diag.download"></button>
      <button type="button" class="small warn" id="logClear" data-i18n="log.clear"></button>
    </div>
    <p class="hint" data-i18n="log.serial.hint"></p>
    <pre class="log-text" id="logText"></pre>
  </section>

  <section class="card">
    <h2 data-i18n="h.print"></h2>
    <div class="print-body">
      <div class="anim" id="anim" hidden><svg id="layers" viewBox="0 0 200 220" aria-hidden="true"></svg></div>
      <div class="anim illu" id="illu" hidden>
        <svg viewBox="0 0 276 126" aria-hidden="true">
          <!-- Drucker frontal: Rahmen, Z-Achsen, X-Achse mit Extruder, Bett mit Druckteil, Display -->
          <rect class="frame" x="16" y="8" width="92" height="96" rx="4"/>
          <rect class="thin" x="28" y="18" width="68" height="58" rx="2"/>
          <path class="thin" d="M22 12V100M102 12V100"/>
          <path class="frame" d="M18 40H106M18 46H106"/>
          <rect class="frame solid" x="15" y="35" width="11" height="16" rx="1.5"/>
          <rect class="frame solid" x="98" y="35" width="11" height="16" rx="1.5"/>
          <rect class="frame solid" x="54" y="29" width="16" height="23" rx="2"/>
          <circle class="thin" cx="62" cy="39" r="4"/>
          <path class="frame" d="M58 52h8l-2 5h-4z"/>
          <path class="layer" d="M49 77H75M51 73.5H73M53 70H71"/>
          <rect class="frame solid" x="8" y="80" width="108" height="5" rx="1.5"/>
          <rect class="frame solid" x="38" y="91" width="40" height="10" rx="1.5"/>
          <circle class="frame" cx="87" cy="96" r="3"/>
          <path class="frame" d="M10 110H114"/>
          <!-- USB-Kabel, getrennt -->
          <path class="cable" d="M109 66C130 66 132 98 152 98C172 98 172 64 191 64"/>
          <g class="x"><circle class="solid" cx="152" cy="98" r="9"/><path class="cut" d="M147 93l10 10M157 93l-10 10"/></g>
          <!-- µprint -->
          <rect class="frame" x="191" y="59" width="5" height="10" rx="1"/>
          <rect class="frame" x="196" y="38" width="66" height="52" rx="7"/>
          <text class="mu" x="229" y="75" text-anchor="middle">µ</text>
          <circle class="led" cx="252" cy="47" r="2.4"/>
        </svg>
      </div>
      <div class="anim illu" id="illuAxi" hidden>
        <svg viewBox="0 0 276 126" aria-hidden="true">
          <!-- AxiDraw von oben: X-Schiene mit Motoren hinten, Schlitten, Arm nach vorn, Stifthalter über dem Papier -->
          <rect class="thin" x="14" y="34" width="96" height="74" rx="1.5"/>
          <path class="art" d="M24 99C40 99 46 97 52 93S58 85 62 89S70 99 76 97S90 99 100 99"/>
          <path class="art" d="M24 93C38 93 44 92 50 88S56 79 60 82S64 86 66 85"/>
          <rect class="frame solid" x="8" y="10" width="108" height="9" rx="2"/>
          <path class="thin" d="M22 14.5H102"/>
          <rect class="frame solid" x="5" y="5" width="16" height="19" rx="2"/>
          <circle class="thin" cx="13" cy="14.5" r="3.5"/>
          <rect class="frame solid" x="103" y="5" width="16" height="19" rx="2"/>
          <circle class="thin" cx="111" cy="14.5" r="3.5"/>
          <rect class="frame solid" x="48" y="7" width="24" height="15" rx="2"/>
          <rect class="frame solid" x="56" y="22" width="9" height="52" rx="1.5"/>
          <path class="thin" d="M60.5 26V70"/>
          <rect class="frame solid" x="51" y="72" width="19" height="13" rx="2"/>
          <circle class="pen" cx="66" cy="85" r="2.6"/>
          <!-- USB-Kabel, getrennt -->
          <path class="cable" d="M119 14C142 14 132 98 152 98C172 98 172 64 191 64"/>
          <g class="x"><circle class="solid" cx="152" cy="98" r="9"/><path class="cut" d="M147 93l10 10M157 93l-10 10"/></g>
          <!-- µprint -->
          <rect class="frame" x="191" y="59" width="5" height="10" rx="1"/>
          <rect class="frame" x="196" y="38" width="66" height="52" rx="7"/>
          <text class="mu" x="229" y="75" text-anchor="middle">µ</text>
          <circle class="led" cx="252" cy="47" r="2.4"/>
        </svg>
      </div>
      <div class="print-main">
        <div class="job-title" id="jobTitle"></div>
        <div class="job-sub" id="jobSub"></div>
        <div class="job-note" id="jobNote" hidden></div>
        <!-- Rückfrage des Druckers, z. B. beim Filamentwechsel (#33) -->
        <div class="derived host-prompt" id="hostPrompt" hidden>
          <div id="hostPromptText"></div>
          <div class="row" id="hostPromptChoices" style="margin-top:8px"></div>
        </div>
        <div id="jobProgress" hidden>
          <div class="bar big"><i id="jobBar"></i></div>
          <div class="job-meta"><span id="jobPct"></span><span id="jobEta"></span></div>
        </div>
        <div class="controls">
          <button type="button" class="big primary" id="bStart" data-i18n="start"></button>
          <button type="button" class="big" id="bPause" data-i18n="pause"></button>
          <button type="button" class="big primary" id="bResume" data-i18n="resume" hidden></button>
          <button type="button" class="big danger" id="bCancel" data-i18n="cancel"></button>
          <button type="button" class="big" id="bAck" data-i18n="ack" hidden></button>
          <button type="button" class="big primary" id="bRetry" data-i18n="retry" hidden></button>
        </div>
      </div>
    </div>
  </section>


  <div class="cols">
  <div class="col">
  <section class="card upload">
    <h2 data-i18n="h.upload"></h2>
    <label id="targetRow" hidden><span data-i18n="target"></span><select id="target"></select></label>
    <div class="drop" id="drop" tabindex="0" role="button">
      <strong id="dropTitle"></strong>
      <span id="dropSub"></span>
      <input type="file" id="file" accept=".gcode,.gco,.g,.svg,image/svg+xml" hidden>
    </div>
    <p class="hint" id="uplotHint"></p>
    <!-- SVG: über µplot prüfen und in G-Code umwandeln, oder in µplot bearbeiten -->
    <div id="svgBox" hidden style="margin-top:10px">
      <p class="derived" id="svgInfo" hidden></p>
      <svg class="svg-prev" id="svgPrev" hidden></svg>
      <div class="row">
        <button type="button" class="primary" id="svgConvert" data-i18n="svg.convert"></button>
        <button type="button" id="svgEdit" data-i18n="svg.edit"></button>
        <button type="button" id="svgCancel" data-i18n="cancel"></button>
      </div>
      <p class="hint" id="svgHint"></p>
    </div>
    <div id="upForm" hidden style="margin-top:10px">
      <div class="row">
        <button type="button" class="primary" id="upBtn" data-i18n="upload"></button>
        <button type="button" id="upCancel" data-i18n="cancel"></button>
      </div>
      <p class="hint" id="upHint"></p>
      <div class="bar" id="upBar" hidden><i></i></div>
    </div>
  </section>

  <section class="card files-card">
    <h2 data-i18n="h.files"></h2>
    <div class="vols" id="vols"></div>
    <!-- Speicher leeren (#14): Bestätigung mit Name, Anzahl und Größe -->
    <div class="derived bad wipe" id="wipeBox" hidden>
      <div id="wipeText"></div>
      <label class="check"><input type="checkbox" id="wipeFormat"> <span data-i18n="wipe.format"></span></label>
      <div class="row">
        <button type="button" class="small danger" id="wipeGo"></button>
        <button type="button" class="small" id="wipeCancel" data-i18n="cancelAction"></button>
      </div>
    </div>
    <input type="search" class="search" id="fileSearch" data-i18n-placeholder="files.search" autocomplete="off" spellcheck="false" hidden>
    <ul class="files" id="files"></ul>
  </section>
  </div>

  <div class="col side">
  <details class="card" id="wifiBox">
    <summary><span class="no-setup" data-i18n="h.wifi"></span><span class="setup-only" data-i18n="setup.title"></span></summary>
    <p class="derived lock-note" data-i18n="lock.print" hidden></p>
    <p class="hint setup-only" id="setupIntro" data-i18n="setup.intro" style="margin:0 0 12px"></p>
    <!-- Ersteinrichtung über das Captive Portal: Name, WLAN und freiwilliges Passwort auf einer Seite -->
    <div class="grid setup-only" id="setupNameBox" style="margin-bottom:16px">
      <label class="full"><span data-i18n="set.device_name"></span><input type="text" id="setupName" maxlength="32" placeholder="µprint" autocomplete="off"></label>
      <p class="hint full" id="setupAddr"></p>
    </div>
    <p class="sub setup-only" id="setupWifiSub" data-i18n="h.wifi" style="margin:0 0 8px"></p>
    <div class="derived" id="wifiStatus"></div>
    <div class="handoff" id="handoff" hidden>
      <p id="handoffText" style="margin:0"></p>
      <p style="margin:12px 0 0"><span class="count" id="handoffCount"></span></p>
      <p class="hint" id="handoffNext"></p>
      <div class="addr"><code id="addrHost"></code><button type="button" data-copy="addrHost" data-i18n="copy"></button></div>
      <div class="addr"><code id="addrIp"></code><button type="button" data-copy="addrIp" data-i18n="copy"></button></div>
    </div>
    <div id="wifiForm">
    <div class="grid">
      <label class="full"><span data-i18n="wifi.network"></span>
        <span class="pick"><select id="wifiNet"></select><button type="button" id="wifiScan" data-i18n="wifi.scan"></button></span>
      </label>
      <label class="full" id="ssidRow" hidden><span data-i18n="wifi.ssid"></span><input type="text" id="wifiSsid" maxlength="32" autocomplete="off"></label>
      <label class="full"><span data-i18n="wifi.password"></span><input type="password" id="wifiPass" maxlength="63" autocomplete="off"></label>
      <label class="check full"><input type="checkbox" id="wifiShow"> <span data-i18n="wifi.show"></span></label>
    </div>
    <div class="grid setup-only" style="margin-top:16px">
      <p class="sub full" data-i18n="setup.pw"></p>
      <label><span data-i18n="auth.password"></span><input type="password" id="setupPass" maxlength="63" autocomplete="new-password"></label>
      <label><span data-i18n="auth.repeat"></span><input type="password" id="setupRep" maxlength="63" autocomplete="new-password"></label>
      <label class="check full"><input type="checkbox" id="setupAp" checked> <span data-i18n="auth.ap"></span></label>
      <p class="hint full" data-i18n="setup.pw.hint"></p>
    </div>
    <div class="row" style="margin-top:12px">
      <button type="button" class="primary" id="wifiConnect" data-i18n="wifi.connect"></button>
      <button type="button" class="warn" id="wifiForget" data-i18n="wifi.forget"></button>
    </div>
    <div class="setup-only" style="margin-top:20px; border-top:1px solid var(--line); padding-top:16px">
      <button type="button" id="wifiApOnly" data-i18n="setup.apOnly"></button>
      <p class="hint" id="apOnlyHint"></p>
    </div>
    <p class="hint" id="wifiHint"></p>
    </div>
  </details>

  <details class="card" id="setBox">
    <summary><span data-i18n="h.settings"></span><span class="badge" id="setBadge" data-i18n="modified" hidden></span></summary>
    <p class="derived lock-note" data-i18n="lock.print" hidden></p>
    <form id="setForm" class="grid" autocomplete="off" onsubmit="return false">
      <p class="sub full" data-i18n="set.device"></p>
      <label class="full"><span data-i18n="set.device_name"></span><input type="text" name="device_name" maxlength="32" placeholder="µprint"></label>
      <p class="hint full" id="setAddr"></p>
      <p class="hint full" data-i18n="set.device.hint"></p>

      <p class="sub full" data-i18n="set.printer"></p>
      <label class="full"><span data-i18n="set.device_type"></span><select name="device_type">
        <option value="0" data-i18n="set.device_type.printer"></option>
        <option value="1" data-i18n="set.device_type.axidraw"></option>
      </select></label>
      <p class="hint full" data-i18n="set.device_type.hint"></p>
      <!-- data-dev: nur für den im Formular gewählten Gerätetyp sichtbar -->
      <label class="full" data-dev="0"><span data-i18n="set.baud"></span><select name="baud"></select></label>
      <p class="hint full" data-dev="0" data-i18n="set.baud.hint"></p>

      <p class="sub full" data-dev="0" data-i18n="set.pause"></p>
      <label data-dev="0"><span data-i18n="set.lift"></span><input type="number" name="pause_lift" min="0" max="50" step="1"></label>
      <span data-dev="0"></span>
      <p class="hint full" data-dev="0" data-i18n="set.pause.hint"></p>

      <p class="sub full" data-dev="0" data-i18n="set.cancel"></p>
      <label data-dev="0"><span data-i18n="set.lift"></span><input type="number" name="cancel_lift" min="0" max="100" step="1"></label>
      <span data-dev="0"></span>
      <label data-dev="0"><span data-i18n="set.park_x"></span><input type="number" name="park_x" step="1"></label>
      <label data-dev="0"><span data-i18n="set.park_y"></span><input type="number" name="park_y" step="1"></label>
      <p class="hint full" data-dev="0" data-i18n="set.cancel.hint"></p>

      <p class="sub full" data-dev="1" data-i18n="set.plotter"></p>
      <label data-dev="1"><span data-i18n="set.plot_draw"></span><input type="number" name="plot_draw" min="1" max="250" step="1"></label>
      <label data-dev="1"><span data-i18n="set.plot_travel"></span><input type="number" name="plot_travel" min="1" max="250" step="1"></label>
      <label data-dev="1"><span data-i18n="set.plot_accel"></span><input type="number" name="plot_accel" min="100" max="10000" step="100"></label>
      <label data-dev="1"><span data-i18n="set.pen_delay"></span><input type="number" name="pen_delay" min="0" max="1000" step="10"></label>
      <label class="full" data-dev="1"><span data-i18n="set.pen_servo"></span><select name="pen_servo">
        <option value="0" data-i18n="set.pen_servo.standard"></option>
        <option value="1" data-i18n="set.pen_servo.brushless"></option>
      </select></label>
      <label data-dev="1"><span data-i18n="set.pen_up"></span><input type="number" name="pen_up" min="0" max="100" step="1"></label>
      <label data-dev="1"><span data-i18n="set.pen_down"></span><input type="number" name="pen_down" min="0" max="100" step="1"></label>
      <label class="full" data-dev="1"><span data-i18n="set.plot_model"></span><select id="plotModel"></select></label>
      <label data-dev="1"><span data-i18n="set.plot_w"></span><input type="number" name="plot_w" min="10" max="2000" step="1"></label>
      <label data-dev="1"><span data-i18n="set.plot_h"></span><input type="number" name="plot_h" min="10" max="2000" step="1"></label>
      <p class="hint full" data-dev="1" data-i18n="set.plotter.hint"></p>

      <p class="sub full" data-i18n="set.uplot"></p>
      <label class="full"><span data-i18n="set.uplot_url"></span>
        <span class="pick"><input type="text" name="uplot_url" maxlength="95" spellcheck="false" placeholder="https://uplot.dmy.work"><button type="button" id="uplotCheck" data-i18n="set.uplot_check"></button></span>
      </label>
      <p class="hint full" id="uplotStatus" data-i18n="set.uplot.hint"></p>

      <p class="sub full" data-i18n="set.slicer"></p>
      <label class="full"><span data-i18n="set.api_key"></span>
        <span class="pick"><input type="text" id="apiKey" readonly spellcheck="false"><button type="button" id="apiCopy" data-i18n="copy"></button><button type="button" id="apiNew" data-i18n="set.api_new"></button></span>
      </label>
      <p class="hint full" id="slicerHint"></p>

      <p class="sub full" data-i18n="set.network"></p>
      <label class="full"><span data-i18n="set.ap_password"></span><input type="password" name="ap_password" maxlength="63"></label>
      <p class="hint full" data-i18n="set.network.hint"></p>
    </form>
    <div class="row set-actions" id="setActions">
      <span class="unsaved" data-i18n="set.unsaved"></span>
      <button type="button" class="primary" id="setSave" data-i18n="save"></button>
      <button type="button" id="setRevert" data-i18n="revert"></button>
    </div>

<script src="i18n.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let st = null, offline = false, volumes = [], files = [], wifi = null, nets = [];
let pick = null, uploading = false, upPct = 0, upXhr = null;
let selKey = null;   // ausgewählte Datei: "<speicher>/<name>"
const fileKey = (f) => f.storage + '/' + f.name;
const selected = () => files.find((f) => fileKey(f) === selKey) || null;

// ---------- Hilfsfunktionen ----------
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const num = (v, d = 0) => v.toLocaleString(LANG, { minimumFractionDigits: d, maximumFractionDigits: d });
function fmtSize(b) {
  if (b >= 1073741824) return num(b / 1073741824, 1) + ' GB';
  if (b >= 1048576) return num(b / 1048576, 1) + ' MB';
  if (b >= 1024) return num(b / 1024) + ' KB';
  return b + ' B';
}
function fmtTime(s) {
  s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}
const volName = (id) => t('vol.' + id);
const fileQuery = (f) => '?storage=' + encodeURIComponent(f.storage) + '&name=' + encodeURIComponent(f.name);
const active = () => st && (st.state === 'printing' || st.state === 'paused');

async function api(method, url, body) {
  let r;
  try { r = await fetch(url, { method, body }); } catch (e) { throw new Error(t('err.network')); }
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && !authMode) showAuth('login');   // z. B. Passwort auf einem anderen Gerät geändert
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// Meldungen unten: Fehler rot, Bestätigungen dezent; verschwinden nach einigen Sekunden
let msgTimer;
function say(text, bad) {
  const m = el('div', 'msg' + (bad ? '' : ' ok'), text);
  $('messages').replaceChildren(m);
  clearTimeout(msgTimer); msgTimer = setTimeout(() => $('messages').replaceChildren(), bad ? 10000 : 5000);
}
async function act(method, url) {
  try { await api(method, url); } catch (e) { say(e.message, true); }
  await refreshStatus();
}

// ---------- Generative Grafik: Schichten wie beim Druck ----------
// Ein Gefäß aus waagrechten Linien; Umriss aus überlagerten Sinuswellen, bestimmt durch den Zufallswert
function profile(seed) {
  let s = seed >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 2 ** 32;
  const a = .6 + rnd() * 1.2, b = 1.5 + rnd() * 3, pa = rnd() * 6.3, pb = rnd() * 6.3, w = .55 + rnd() * .3, amp = .12 + rnd() * .14;
  return (f) => Math.max(.18, Math.min(1, w + amp * Math.sin(f * Math.PI * a + pa) + amp * .5 * Math.sin(f * Math.PI * b + pb)));
}
function hash(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.codePointAt(0), 16777619); return h >>> 0; }

// Logo im AxiDraw-Modus: Wellenlinien wie auf „Unknown Pleasures“ (Verfahren wie in µgen): von vorn nach
// hinten zeichnen, je Spalte die höchste Stelle merken, verdeckte Teile weglassen. Vorderste Linie im Akzent.
function drawWaves() {
  let s = (Math.random() * 2 ** 32) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 2 ** 32;
  const grid = Array.from({ length: 24 }, () => Array.from({ length: 12 }, rnd));
  const smooth = (t) => t * t * (3 - 2 * t);
  const noise = (x, r) => {   // Wertrauschen, glatt in x, je Linie eigene Werte
    const i = Math.floor(x), f = smooth(x - i), row = grid[r % grid.length];
    return row[i % row.length] * (1 - f) + row[(i + 1) % row.length] * f;
  };
  const n = 9, x0 = 5, x1 = 29, step = .5, cols = Math.round((x1 - x0) / step) + 1;
  const horizon = new Array(cols).fill(Infinity), out = [];
  for (let r = n - 1; r >= 0; r--) {   // vorn (unten) zuerst
    const y = 12 + r * 2.1, runs = [];
    let run = null;
    for (let c = 0; c < cols; c++) {
      const x = x0 + c * step, u = (x - 17) / 12;
      const env = Math.exp(-Math.pow(Math.abs(u) / .42, 2));
      const py = y - 7 * env * Math.pow(noise(x / 2.2, r), 2) - noise(x / .9, r + 7) * .25 * (1 - env);
      if (py <= horizon[c]) {
        horizon[c] = py;
        if (!run) { run = []; runs.push(run); }
        run.push(x.toFixed(1) + ' ' + py.toFixed(2));
      } else run = null;
    }
    const front = r === n - 1;
    for (const p of runs) if (p.length > 1)
      out.push(`<path d="M${p.join('L')}" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="${front ? 'var(--accent)' : 'var(--panel)'}" stroke-width="${front ? 1.3 : .8}" opacity="${front ? 1 : .85}"/>`);
  }
  $('mark').innerHTML = out.join('');
  setFavicon();
}

// Favicon = das gerade gezeichnete Logo; die Farbvariablen gelten dort nicht, deshalb hier eingesetzt
function setFavicon() {
  const css = getComputedStyle(document.documentElement);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34"><rect width="34" height="34" rx="8" fill="var(--ink)"/>${$('mark').innerHTML}</svg>`
    .replace(/var\((--[\w-]+)\)/g, (_, v) => css.getPropertyValue(v).trim());
  $('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}

let heatLevel = 0;        // Aufheizstand 0…1 für die Animation
let titleProgress = '';   // Fortschritt vorn im Tabtitel, solange gedruckt oder geplottet wird
let markAxi = false;
function drawMark() {   // Logo: bei jedem Laden (und Klick) ein neues Gefäß, die oberste Schicht im Akzent
  markAxi = axiMode();
  if (markAxi) return drawWaves();
  const r = profile(Math.random() * 2 ** 32), n = 11, out = [];
  for (let i = 0; i < n; i++) {
    const y = 28 - i * 2.2, half = r(i / (n - 1)) * 12, top = i === n - 1;
    out.push(`<path d="M${(17 - half).toFixed(1)} ${y.toFixed(1)}H${(17 + half).toFixed(1)}" fill="none" stroke-linecap="round" stroke="${top ? 'var(--accent)' : 'var(--panel)'}" stroke-width="${top ? 1.6 : .9}" opacity="${top ? 1 : .8}"/>`);
  }
  $('mark').innerHTML = out.join('');
  setFavicon();
}

let layersKey = '';
function drawLayers(seed, frac, mode) {   // mode: idle | heating | printing | paused | done (bei heating ist frac die Temperatur)
  const N = 44, done = mode === 'heating' ? 0 : Math.min(N, Math.floor(frac * N));
  const key = [seed, done, mode, mode === 'heating' ? Math.round(frac * 50) : ''].join();
  if (key === layersKey) return;      // nicht bei jeder Abfrage neu zeichnen, sonst springt die Animation
  layersKey = key;
  const r = profile(seed), out = [];
  const yAt = (i) => 206 - i * (192 / (N - 1));
  for (let i = 0; i < N; i++) {
    const half = r(i / (N - 1)) * 80, y = yAt(i).toFixed(1);
    const cls = mode === 'idle' || mode === 'heating' ? 'todo' : mode === 'done' || i < done ? 'done' : i === done ? 'cur' : 'todo';
    out.push(`<path class="${cls}" d="M${(100 - half).toFixed(1)} ${y}H${(100 + half).toFixed(1)}" stroke-linecap="round"/>`);
  }
  if (mode === 'heating') {   // unterste Schicht als Bett, von der Mitte aus nach Temperatur gefüllt
    const half = r(0) * 80 * Math.min(1, frac), y = yAt(0) - 3;
    if (half > .5) out.push(`<path class="bed" d="M${(100 - half).toFixed(1)} ${yAt(0)}H${(100 + half).toFixed(1)}" stroke-linecap="round"/>`);
    const waves = [-7, 0, 7].map((dx, i) => `<path class="waft" style="animation-delay:${i * .8}s" d="M${100 + dx} ${y - 12}q-2 -3 0 -6t0 -6"/>`);
    out.push(`<g class="heat"><path class="nozzle" d="M${100 - 4} ${y - 9}h8v4l-3 5h-2l-3-5z"/>${waves.join('')}</g>`);
  }
  if ((mode === 'printing' || mode === 'paused') && done < N) {   // Düse über der aktuellen Schicht, fährt beim Drucken hin und her
    const half = r(done / (N - 1)) * 80, y = yAt(done) - 3;
    const anim = mode === 'printing'
      ? `<animateTransform attributeName="transform" type="translate" values="${-half} 0;${half} 0;${-half} 0" dur="3s" repeatCount="indefinite"/>` : '';
    out.push(`<g><path class="nozzle" d="M${100 - 4} ${y - 9}h8v4l-3 5h-2l-3-5z"/>${anim}</g>`);
  }
  $('layers').innerHTML = out.join('');
}

// ---------- Status ----------
async function refreshStatus() {
  try {
    const s = await api('GET', '/api/status');
    // Dateiliste neu laden, wenn sich Dateien oder Speicher geändert haben (auch durch Slicer oder SD-Karte)
    const changed = !st || st.state !== s.state || st.files_rev !== s.files_rev || offline, back = offline;
    // Beim Druckstart die Auswahl lösen, damit danach „Druck fertig“ erscheint
    if (changed && st && (s.state === 'printing' || s.state === 'paused')) selKey = null;
    st = s; offline = false;
    renderStatus(); renderLedDot();
    if (changed) loadFiles();
    if (back) loadSettings();
  } catch (e) {
    offline = true; renderStatus();
  }
}
async function poll() { await refreshStatus(); setTimeout(poll, 1500); }

// Letzter Druck fertig: so lange anzeigen, bis eine andere Datei gewählt wird
const finished = () => !offline && st && st.state === 'idle' && st.finished && !selKey;
const finishedFile = () => finished() ? files.find((f) => f.storage === st.storage && f.name === st.file) || null : null;

function renderStatus() {
  const s = st || {}, a = !offline && active(), done = finished(), show = a || done;
  const state = offline ? 'offline' : s.state || 'connecting';
  // Aufheizen bis zur ersten Fahrt mit Extrusion, Stand wie bei den Status-LEDs (wird nie kleiner)
  const heating = !offline && s.state === 'printing' && !s.extruding && !axiMode() && (s.hotend_target > 0 || s.bed_target > 0);
  const lvl = (v, target) => target > 0 ? Math.min(1, v / target) : 1;
  heatLevel = heating ? Math.max(heatLevel, Math.min(lvl(s.hotend, s.hotend_target), lvl(s.bed, s.bed_target))) : 0;
  const tab = $('tab');
  tab.textContent = t(s.unresponsive && !offline ? 'state.unresponsive'
    : state === 'disconnected' && axiMode() ? 'state.axiDisconnected'
    : state === 'printing' && s.user_wait ? 'state.userWait' : heating ? 'state.heating' : 'state.' + state);
  // Pause und Warten am Display in eigener Farbe, damit sie nicht wie „bereit“ aussehen
  const hold = !offline && (state === 'paused' || (state === 'printing' && s.user_wait));
  tab.className = 'tab ' + (hold ? 'hold busy' : { idle: 'on', printing: 'on busy', connecting: 'wait busy', error: 'bad', offline: 'bad' }[state] || '');

  // Fortschritt und Restzeit aus M73 (Slicer), sonst nach gesendeten Bytes geschätzt
  const pct = a ? (s.progress >= 0 ? s.progress : s.size ? s.pos / s.size * 100 : 0) : done ? 100 : 0;
  const left = !a ? null : s.remaining >= 0 ? s.remaining : pct > 2 ? s.elapsed * (100 - pct) / pct : null;
  const temp = (v, target) => offline || s.state === 'disconnected' ? '–' : Math.round(v) + '°' + (target > 0 ? ' / ' + Math.round(target) + '°' : '');
  const items = [
    ['stat.progress', show ? num(pct, 1) + ' %' : '–'],
    ['stat.elapsed', a ? fmtTime(s.elapsed) : done ? fmtTime(s.duration) : '–'],
    ['stat.remaining', left != null ? fmtTime(left) : '–'],
    // Ein Plotter hat keine Temperaturen
    ...(axiMode() ? [] : [['stat.hotend', temp(s.hotend, s.hotend_target)], ['stat.bed', temp(s.bed, s.bed_target)]]),
  ];
  $('stats').replaceChildren(...items.map(([k, v]) => { const d = el('div', 'stat'); d.append(el('b', '', v), el('span', '', t(k))); return d; }));

  // Bedienelemente bleiben sichtbar und sind nur aktiv, wenn sie etwas bewirken
  const chosen = selected(), again = !chosen && finishedFile();
  const issue = fileIssue(chosen || again);
  $('bStart').disabled = offline || s.state !== 'idle' || !(chosen || again) || !!(issue && issue.block);
  $('bStart').textContent = t(done ? 'reprint' : 'start');
  $('bPause').hidden = !offline && s.state === 'paused';
  $('bPause').disabled = offline || s.state !== 'printing';
  $('bResume').hidden = offline || s.state !== 'paused';
  $('bCancel').disabled = !a;
  $('bAck').hidden = offline || s.state !== 'error';
  $('bRetry').hidden = offline || !s.unresponsive;

  let title, sub = s.message || '', bad = s.state === 'error';
  if (offline) { title = t('stage.offline'); sub = t('stage.offlineHint'); bad = true; }
  else if (show) title = s.file;
  else if (s.state === 'disconnected' && s.unresponsive) { title = t('stage.unresponsive'); sub = t('stage.unresponsiveHint'); bad = true; }
  else if (s.state === 'disconnected') { const k = axiMode() ? 'stage.axiDisconnected' : 'stage.disconnected'; title = t(k); sub = t(k + 'Hint'); }
  else if (s.state === 'connecting') { title = t('stage.connecting'); sub = ''; }
  else if (s.state === 'error') { title = t('state.error'); sub = s.message; }
  else if (chosen) {
    title = chosen.name;
    sub = volName(chosen.storage) + ' · ' + fmtSize(chosen.size) + ' · ' + (issue ? issueText(issue, chosen) : t('job.ready'));
    bad = !!issue;
  }
  else { title = t('stage.idle'); sub = t('stage.idleHint'); }
  // Meldungen der Firmware wie „Druck fertig …“ zusätzlich zeigen, solange nichts läuft
  const note = !offline && !done && s.state === 'idle' && !s.finished && s.message && !['Drucker bereit', 'Fehler quittiert'].includes(s.message) ? s.message : '';
  // Meldungen des Druckers selbst ("action:notification") haben Vorrang
  const shownNote = !offline && s.notice ? s.notice : !offline && a && s.user_wait ? t('job.userWait') : note;
  $('jobNote').textContent = shownNote; $('jobNote').hidden = !shownNote;
  renderPrompt(offline ? null : s.prompt);
  $('jobTitle').textContent = title;
  // Während des Drucks den übersetzten Zustand zeigen, sonst die Meldung der Firmware
  $('jobSub').textContent = a ? volName(s.storage) + ' · ' + t(heating ? 'state.heating' : 'state.' + s.state) : done ? volName(s.storage) + ' · ' + t('stage.done') : sub;
  $('jobSub').className = 'job-sub' + (bad ? ' bad' : done ? ' done' : '');
  $('jobProgress').hidden = !show;
  $('jobBar').style.width = pct + '%';
  $('jobPct').textContent = show ? num(pct, 1) + ' %' : '';
  const tp = !a ? '' : heating ? t('state.heating') : (s.state === 'paused' ? '⏸ ' : '') + num(pct, 1) + ' %';
  if (tp !== titleProgress) { titleProgress = tp; renderName(); }

// Vorschau aus dem G-Code: Linien mit Stift unten (Z0) auf der Zeichenfläche, Seite gestrichelt
function drawPreview(gcode, info) {
  const a = plotArea(), out = [];
  let x = 0, y = 0, down = false, path = '';

    const line = raw.split(';')[0].trim();
    if (!/^G0*[01]\b/i.test(line)) continue;
    const v = (k) => { const m = line.match(new RegExp('\\b' + k + '(-?[\\d.]+)', 'i')); return m ? +m[1] : null; };
    const z = v('Z');

    if (nx !== x || ny !== y) path += (down ? 'L' : 'M') + nx.toFixed(2) + ' ' + ny.toFixed(2);
    x = nx; y = ny;

  const page = info && info.page_w ? `<rect class="page" x="0" y="0" width="${info.page_w}" height="${info.page_h}" vector-effect="non-scaling-stroke"/>` : '';
  out.push(`<rect class="area" x="0" y="0" width="${a.w}" height="${a.h}"/>`, page,
           `<path class="draw" stroke-width="0.4" d="${path}"/>`);
  const svg = $('svgPrev');
  svg.setAttribute('viewBox', `-4 -4 ${a.w + 8} ${a.h + 8}`);
  svg.innerHTML = out.join('');

    x.onload = () => {

function reasonText(w) {

}
function signal(rssi) { return t(rssi >= -60 ? 'wifi.signal.good' : rssi >= -72 ? 'wifi.signal.ok' : 'wifi.signal.weak') + ' (' + rssi + ' dBm)'; }

// Link auf die Adresse von uprint im WLAN, damit man vom Access Point direkt dorthin wechseln kann.

const hostLinks = {};

const SET_KEYS = ['device_name', 'device_type', 'baud', 'pause_lift', 'cancel_lift', 'park_x', 'park_y',
  'plot_draw', 'plot_travel', 'plot_accel', 'pen_servo', 'pen_up', 'pen_down', 'pen_delay', 'plot_w', 'plot_h', 'uplot_url',

const field = (k) => setForm.elements[k] || hwForm.elements[k];
let settings = null;

const setValue = (e) => (e.type === 'checkbox' ? (e.checked ? '1' : '0') : e.value.trim());
function readSettings() {
  return Object.fromEntries(SET_KEYS.map((k) => [k, setValue(field(k))]));
}
// XIAO: Pins mit ihrer Beschriftung auf dem Board statt als GPIO-Nummer, D6 ist die Log-Ausgabe der Konsole und
// nur ohne Konsole wählbar
const SD_PINS = ['sd_mosi', 'sd_miso', 'sd_sclk', 'sd_cs'];
const XIAO_PINS = [[1, 'D0'], [2, 'D1'], [3, 'D2'], [4, 'D3'], [5, 'D4'], [6, 'D5'], [43, 'D6'], [44, 'D7'], [7, 'D8'], [8, 'D9'], [9, 'D10']];
function xiaoPins(s) {
  $('sdPinHint').hidden = s.variant !== 'xiao';
  $('consoleHint').dataset.i18n = s.variant === 'xiao' ? 'set.console.hint.xiao' : 'set.console.hint';
  $('consoleHint').textContent = t($('consoleHint').dataset.i18n);
  if (s.variant !== 'xiao') return;
  const board = XIAO_PINS.filter(([g]) => g !== 43 || String(s.console) !== '1');
  for (const k of [...SD_PINS, 'led_pin']) {
    let sel = field(k);
    if (sel.tagName !== 'SELECT') {
      sel = document.createElement('select');
      sel.name = k;
      field(k).replaceWith(sel);
    }
    const pins = k === 'sd_cs' ? [...board, [21, t('set.sd.slot')]] : k === 'led_pin' ? [[-1, t('leds.off')], ...board]
      : [...board];
    if (!pins.some(([g]) => g === Number(s[k]))) pins.push([s[k], 'GPIO ' + s[k]]);   // D6, wenn die Konsole wieder an ist
    sel.replaceChildren(...pins.map(([g, label]) => new Option(label, g)));
  }
}
function writeSettings(s) {

  const sel = setForm.elements.baud, bauds = BAUDS.includes(s.baud) ? BAUDS : [...BAUDS, s.baud].sort((a, b) => a - b);
  sel.replaceChildren(...bauds.map((b) => new Option(String(b), b)));
  for (const k of SET_KEYS) {
    const e = field(k);
    if (e.type === 'checkbox') e.checked = s[k] === 1; else e.value = s[k];
  }
  syncPlotModel();
}

const setModified = (form) => !!settings &&

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = 'uprint-axidraw-test-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---------- Status-LEDs ----------
// Unterseite #leds: Effekt, Farbe und Helligkeit je Zustand. leds = gespeicherter Stand mit Standardwerten,
// edit = Eingaben. Die Vorschau zeigt die Eingaben auf dem Strip, auch ungespeichert.
let leds = null, ledEdit = null;
const LED_INTERVALS = [0, 10, 30, 60];
const lookKey = (l) => l.effect + '|' + l.color.toLowerCase() + '|' + l.bright;
function renderLedDot() {
  const on = !!st && !!st.led_id;
  $('ledCurrent').hidden = !on;
  if (on) $('ledCurrent').textContent = settings && settings.led_max_ma
    ? t('leds.current', { ma: st.led_ma, max: settings.led_max_ma }) : t('leds.current.nolimit', { ma: st.led_ma });
  const c = st && st.led_id;
  $('ledDot').hidden = !c;
  if (c) { $('ledDot').style.background = c; $('ledDot').title = t('leds.dot'); }
}
const samePattern = (a, b) => a.every((c, i) => c.toLowerCase() === b[i].toLowerCase());
function ledEditModified() {
  if (!leds || !ledEdit) return false;
  return ledEdit.states.some((s, i) => lookKey(s) !== lookKey(leds.states[i])) ||
    !samePattern(ledEdit.pattern, leds.pattern) || ledEdit.id_interval !== leds.id_interval;
}
function buildLedRows() {
  const rows = ledEdit.states.map((s, i) => {
    const row = el('div', 'led-row');
    const name = el('div', 'name', t('ls.' + s.id));
    const custom = el('small', null, t('leds.custom'));
    name.append(custom);
    const color = el('input'); color.type = 'color'; color.value = s.color; color.setAttribute('aria-label', t('leds.color'));
    const fx = el('select'); fx.setAttribute('aria-label', t('leds.effect'));
    for (const e of s.effects) fx.add(new Option(t('fx.' + e), e));
    fx.value = s.effect;
    const bright = el('label', 'bright'); const range = el('input'); range.type = 'range'; range.min = 0; range.max = 100; range.value = s.bright;
    range.setAttribute('aria-label', t('leds.bright'));
    const pct = el('span', null, s.bright + ' %'); bright.append(range, pct);
    const prev = el('button', 'small', t('leds.preview')); prev.type = 'button';
    // Kennung: Farben kommen aus dem Muster darunter
    if (s.id === 'id') color.classList.add('noop');
    const update = () => {
      s.color = color.value; s.effect = +fx.value; s.bright = +range.value; pct.textContent = s.bright + ' %';
      custom.hidden = lookKey(s) === lookKey(s.default) && (s.id !== 'id' || samePattern(ledEdit.pattern, ledEdit.pattern_default));
      row.classList.toggle('unsaved', lookKey(s) !== lookKey(leds.states[i]));
      renderLedActions();
    };
    color.oninput = fx.onchange = range.oninput = update;
    prev.onclick = async () => {
      const q = new URLSearchParams({ state: s.id, effect: s.effect, color: s.color.slice(1), bright: s.bright });
      const body = s.id === 'id' ? new URLSearchParams({ pattern: patternParam() }) : undefined;
      try { await api('POST', '/api/leds/preview?' + q, body); } catch (e) { say(e.message, true); }
    };
    if (s.id === 'id') idRowUpdate = update;
    row.append(name, color, fx, bright, prev);
    update();
    return row;
  });
  $('ledRows').replaceChildren(...rows);
  buildLedGrid();
  const iv = $('ledInterval');
  iv.replaceChildren(...LED_INTERVALS.map((v) => new Option(v ? t('leds.every', { s: v }) : t('leds.off'), v)));
  iv.value = ledEdit.id_interval;
  renderLedActions();
}
function renderLedActions() {
  const mod = ledEditModified();
  $('ledSave').disabled = !mod;
  $('ledRevert').disabled = !mod;
}
// Muster der Kennung: so viele Felder wie LEDs eingestellt, anmalen per Klick oder Ziehen (auch mit dem Finger),
// Rechtsklick nimmt die Farbe eines Felds als Pinsel
let idRowUpdate = null, painting = null;   // letzte Zeigerposition beim Malen
const ledCount = () => (settings ? Math.min(settings.led_count, ledEdit.pattern.length) : 0);
const patternParam = () => ledEdit.pattern.slice(0, Math.max(1, ledCount())).map((c) => c.slice(1)).join(',');
function paintCell(cell) {
  const i = +cell.dataset.i, c = $('ledBrush').value;
  if (ledEdit.pattern[i] === c) return;
  ledEdit.pattern[i] = c; cell.style.background = c;
  renderLedGridState();
}
function renderLedGridState() {
  $('ledGrid').classList.toggle('unsaved', !samePattern(ledEdit.pattern, leds.pattern));
  if (idRowUpdate) idRowUpdate();
}
function buildLedGrid() {
  const n = ledCount(), grid = $('ledGrid');
  grid.replaceChildren(...Array.from({ length: n }, (_, i) => {
    const cell = el('i'); cell.dataset.i = i; cell.style.background = ledEdit.pattern[i];
    cell.title = 'LED ' + (i + 1); cell.append(el('span', null, i + 1));
    return cell;
  }));
  grid.hidden = !n;
  $('ledGridHint').textContent = n ? t('leds.pattern.hint') : t('leds.pattern.none');
  if (!$('ledBrush').dataset.set) $('ledBrush').value = ledEdit.pattern[0];
  renderLedGridState();
}
$('ledBrush').oninput = () => { $('ledBrush').dataset.set = '1'; };
$('ledGrid').addEventListener('pointerdown', (e) => {
  const cell = e.target.closest('i');
  if (!cell || e.button === 2) return;
  painting = { x: e.clientX, y: e.clientY }; paintCell(cell); e.preventDefault();
});
// Zwischen zwei Ereignissen die Strecke abtasten, sonst überspringt schnelles Ziehen einzelne LEDs
$('ledGrid').addEventListener('pointermove', (e) => {
  if (!painting) return;
  const dx = e.clientX - painting.x, dy = e.clientY - painting.y, steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 6));
  for (let k = 1; k <= steps; k++) {
    const cell = document.elementFromPoint(painting.x + dx * k / steps, painting.y + dy * k / steps);
    if (cell && cell.parentElement === $('ledGrid')) paintCell(cell);
  }
  painting = { x: e.clientX, y: e.clientY };
});
window.addEventListener('pointerup', () => { painting = null; });
$('ledGrid').addEventListener('contextmenu', (e) => {
  const cell = e.target.closest('i');
  if (!cell) return;
  e.preventDefault();
  $('ledBrush').value = ledEdit.pattern[+cell.dataset.i]; $('ledBrush').dataset.set = '1';
});
$('ledFill').onclick = () => {
  for (let i = 0; i < ledEdit.pattern.length; i++) ledEdit.pattern[i] = $('ledBrush').value;
  buildLedGrid();
};
$('ledPatternDefault').onclick = () => { ledEdit.pattern = [...ledEdit.pattern_default]; buildLedGrid(); };
$('ledInterval').onchange = () => { ledEdit.id_interval = +$('ledInterval').value; renderLedActions(); };
function setLeds(j) { leds = j; ledEdit = structuredClone(j); buildLedRows(); }
async function loadLeds() {
  try { setLeds(await api('GET', '/api/leds')); } catch (e) { say(e.message, true); }
}
$('ledSave').onclick = async () => {
  const p = new URLSearchParams();
  for (const s of ledEdit.states) {
    p.set(s.id + '_effect', s.effect); p.set(s.id + '_color', s.color); p.set(s.id + '_bright', s.bright);
  }
  p.set('pattern', ledEdit.pattern.map((c) => c.slice(1)).join(',')); p.set('id_interval', ledEdit.id_interval);
  try { setLeds(await api('POST', '/api/leds', p)); say(t('leds.saved')); refreshStatus(); }
  catch (e) { say(e.message, true); }
};
$('ledRevert').onclick = () => { setLeds(leds); say(t('set.discarded')); };
$('ledReset').onclick = async () => {
  if (!confirm(t('confirm.leds_reset'))) return;
  try { setLeds(await api('POST', '/api/leds/reset')); say(t('leds.resetDone')); refreshStatus(); }
  catch (e) { say(e.message, true); }
};
$('ledFind').onclick = $('ledFind2').onclick = async () => {
  try { await api('POST', '/api/led/find'); say(t('leds.finding')); } catch (e) { say(e.message, true); }
};
function ledView() {
  const on = location.hash === '#leds';
  document.body.classList.toggle('leds', on);
  $('ledsView').hidden = !on;
  if (on) { loadLeds(); window.scrollTo(0, 0); }
}
window.addEventListener('hashchange', ledView);

// ---------- Unterseite #log: Live-Log und Diagnose (#36) ----------
// logPos = Position für die nächste Abfrage (X-Log-Next), null = die letzten 64 KB holen
const LOG_KEEP = 4000;   // Zeilen in der Ansicht
let logPos = null, logRest = '', logLines = [], logPaused = false, logTimer = null;
function logClass(l) {
  if (l.startsWith('=====')) return 'b';
  return { E: 'e', W: 'w', S: 's' }[l[0]] || '';
}
function logShown(l) {
  const f = $('logFilter').value;
  if (l.startsWith('=====')) return true;
  if (f === 'printer') return / printer: /.test(l);
  if (f === 'warn') return /^[EW] \(/.test(l);
  return true;
}
function logLine(l) {
  const c = logClass(l);
  return c ? el('span', c, l + '\n') : document.createTextNode(l + '\n');
}
function logRender() {
  $('logText').replaceChildren(...logLines.filter(logShown).map(logLine));
  logScroll();
}
function logScroll() { if ($('logFollow').checked) $('logText').scrollTop = $('logText').scrollHeight; }
function logAppend(text) {
  const parts = (logRest + text).split('\n');
  logRest = parts.pop();
  const fresh = parts.filter((l) => l !== '');
  logLines.push(...fresh);
  const pre = $('logText');
  if (logLines.length > LOG_KEEP) { logLines = logLines.slice(-LOG_KEEP); logRender(); return; }
  pre.append(...fresh.filter(logShown).map(logLine));
  logScroll();
}
function logReset() { logPos = null; logRest = ''; logLines = []; $('logText').replaceChildren(); }
async function pollLog() {
  clearTimeout(logTimer);
  if (location.hash !== '#log') return;
  if (!logPaused && !document.hidden) {
    try {
      const r = await fetch('/api/log?' + (logPos === null ? 'tail=65536' : 'since=' + logPos), { cache: 'no-store' });
      if (r.status === 401 && !authMode) showAuth('login');
      if (r.ok) {
        const next = Number(r.headers.get('X-Log-Next'));
        const text = await r.text();
        if (logPos !== null && next < logPos) logReset();   // nach dem Einschalten beginnt das Log neu
        logAppend(text);
        logPos = next;
        if (document.activeElement !== $('logSerial')) $('logSerial').value = r.headers.get('X-Log-Serial') || '0';
      }
    } catch {}
  }
  logTimer = setTimeout(pollLog, 1000);
}
function logView() {
  const on = location.hash === '#log';
  document.body.classList.toggle('log', on);
  $('logView').hidden = !on;
  if (on) { logReset(); window.scrollTo(0, 0); pollLog(); }
}
window.addEventListener('hashchange', logView);
$('logFilter').onchange = logRender;
$('logFollow').onchange = logScroll;
$('logPause').onclick = () => {
  logPaused = !logPaused;
  $('logPause').textContent = t(logPaused ? 'log.resume' : 'log.pause');
  if (!logPaused) pollLog();
};
$('logSerial').onchange = async () => {
  try { await api('POST', '/api/log/serial?level=' + $('logSerial').value); say(t('log.serial.saved')); }
  catch (e) { say(e.message, true); }
};
$('logClear').onclick = async () => {
  if (!confirm(t('confirm.log.clear'))) return;
  try { await api('DELETE', '/api/log'); logRest = ''; logLines = []; $('logText').replaceChildren(); }
  catch (e) { say(e.message, true); }
};
$('logDiag').onclick = $('diagDownload').onclick = () => {
  const a = el('a'); a.href = '/api/diag'; a.download = ''; a.click();
};

// ---------- Gerätename ----------
// Gespeicherter Name oben und im Browser-Tab; ohne Namen wie gewohnt „µprint“
// Wie settings_hostname_from_name() in settings.c
const HOST_MAP = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss', 'µ': 'u', 'μ': 'u' };
function hostFromName(name, def) {
  const h = name.toLowerCase().replace(/[äöüßµμ]/g, (c) => HOST_MAP[c]).replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+/, '').slice(0, 32).replace(/-+$/, '');
  return h || def;
}
// Adresse zum Namen: unverändert die tatsächliche, sonst die künftige
function addrFor(name) {
  if (!settings) return '';
  const host = name === settings.device_name ? settings.hostname : hostFromName(name, settings.default_hostname);
  return t('set.addr', { host });
}
function renderAddr() {
  $('setAddr').textContent = addrFor(setForm.elements.device_name.value.trim());
  $('setupAddr').textContent = addrFor($('setupName').value.trim());
}
$('setupName').oninput = renderAddr;

function renderName() {
  const name = settings && settings.device_name;
  $('devName').textContent = name || 'µprint';
  $('tagline').textContent = t(name ? 'tagline.named' : 'tagline');
  document.title = (titleProgress ? titleProgress + ' · ' : '') + (name ? name + ' · µprint' : 'µprint');
}

// ---------- Slicer-Anbindung ----------
function renderSlicer() {
  if (!settings) return;
  $('apiKey').value = settings.api_key;
  $('slicerHint').innerHTML = t('set.slicer.hint.html', { host: settings.hostname });   // Hostname ist a–z, 0–9, -
}
$('apiCopy').onclick = async () => {
  const k = $('apiKey');
  // Die Zwischenablage-API gibt es nur über HTTPS; sonst der klassische Weg
  try { await navigator.clipboard.writeText(k.value); } catch { k.select(); document.execCommand('copy'); }
  say(t('set.api_copied'));
};
$('apiNew').onclick = async () => {
  if (!confirm(t('confirm.api_new'))) return;
  try { settings = await api('POST', '/api/settings/apikey'); renderSettings(); say(t('set.api_renewed')); }
  catch (e) { say(e.message, true); }
};

// ---------- Firmware-Update ----------
let otaFile = null, otaBusy = false;
function renderOta() {
  $('otaVersion').textContent = settings ? t('ota.version', { v: settings.version, variant: settings.variant }) : '';
  // CI baut ohne führendes v (0.9.0), lokale Builds mit (v0.9.0-3-gabc)
  $('footVersion').textContent = settings ? ' · v' + settings.version.replace(/^v/, '') + ' (' + settings.variant + ')' : '';
  const failed = settings && settings.failed_update;
  $('otaRollback').hidden = !failed;
  if (failed) $('otaRollback').textContent = t('ota.rolledBack', { failed, v: settings.version });
  if (!otaBusy) $('otaHint').textContent = t('ota.hint', { variant: settings ? settings.variant : '…' });
  $('otaName').textContent = otaFile ? otaFile.name + ' · ' + fmtSize(otaFile.size) : '';
  $('otaPick').disabled = otaBusy;
  $('otaBtn').disabled = !otaFile || otaBusy || offline || active();
  $('otaBar').hidden = !otaBusy;
}
$('otaPick').onclick = () => $('otaFile').click();
$('otaFile').onchange = (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (!/\.bin$/i.test(f.name)) { say(t('ota.badType'), true); return; }
  otaFile = f; renderOta();
};
$('otaBtn').onclick = async () => {
  if (!otaFile || !confirm(t('confirm.ota', { name: otaFile.name }))) return;
  otaBusy = true; renderOta();
  const bar = $('otaBar').firstElementChild;
  bar.style.width = '0';
  try {
    const r = await sendRaw('/api/ota', otaFile, (p) => { bar.style.width = p + '%'; $('otaHint').textContent = t('ota.running', { pct: Math.round(p) }); });
    say(t('ota.done', { v: r.version }));
    otaFile = null;
  } catch (e) { say(t('ota.failed', { msg: e.message }), true); }
  otaBusy = false;
  renderOta();
};

// ---------- Sprache ----------
for (const [code, name] of Object.entries(LANGS)) $('lang').add(new Option(name, code));
$('lang').value = LANG;
$('lang').onchange = () => {
  LANG = $('lang').value;
  try { localStorage.setItem('uprint-lang', LANG); } catch {}
  applyI18n(); renderName(); renderStatus(); renderVolumes(); renderUpload(); renderWifi(); fillPlotModels(); renderSvg(); renderUplotHint();
  if (authMode) showAuth(authMode);
  renderPw();
  if (ledEdit) buildLedRows();
  if (settings) { const cur = readSettings(); writeSettings({ ...settings, ...cur, baud: +cur.baud }); }
  renderAxi();
};

// ---------- Anmeldung (#31) ----------
// login: Passwort gesetzt, keine gültige Sitzung; setup: noch kein Passwort und die Frage danach nicht übersprungen.
// Die Frage kommt erst nach der WLAN-Einrichtung (nicht im Captive Portal), siehe loadWifi().
let authMode = null, started = false, auth = null;
function showAuth(mode) {
  authMode = mode;
  document.body.classList.toggle('gate', !!mode);
  $('authBox').hidden = !mode;
  if (!mode) return;
  const setup = mode === 'setup';
  $('authTitle').textContent = t('auth.' + mode + '.title');
  $('authIntro').textContent = t('auth.' + mode + '.intro');
  $('authPassLabel').textContent = t(setup ? 'auth.new' : 'auth.password');
  $('authPass').autocomplete = setup ? 'new-password' : 'current-password';
  $('authRepRow').hidden = $('authApRow').hidden = $('authSkip').hidden = $('authSkipHint').hidden = !setup;
  $('authBtn').textContent = t('auth.' + mode + '.btn');
  $('authPass').focus();
}
$('authForm').onsubmit = async (e) => {
  e.preventDefault();
  const pass = $('authPass').value, setup = authMode === 'setup', ap = $('authAp').checked;
  try {
    if (setup) {
      if (pass.length < 8) throw new Error(t('auth.short'));
      if (pass !== $('authRep').value) throw new Error(t('auth.mismatch'));
      await api('POST', '/api/auth/password', new URLSearchParams({ password: pass, ap: ap ? '1' : '0' }));
      say(t(ap ? 'auth.set.ap' : 'auth.set'));
      auth = { password: true, session: true, setup: false };
    } else {
      await api('POST', '/api/auth', new URLSearchParams({ password: pass }));
    }
    $('authForm').reset();
    showAuth(null); renderPw();
    if (started) loadSettings(); else start();
  } catch (e) { say(e.message, true); }
};
$('authSkip').onclick = async () => {
  try {
    await api('POST', '/api/auth/skip');
    auth.setup = false;
    showAuth(null); renderPw();
    say(t('auth.skipped'));
  } catch (e) { say(e.message, true); }
};
async function checkAuth() {
  try { auth = await api('GET', '/api/auth'); } catch { setTimeout(checkAuth, 3000); return; }
  renderPw();
  showAuth(auth.password && !auth.session ? 'login' : null);
  if (!authMode) start();
}
function start() {
  started = true;
  pollWifi(); loadSettings(); pollAxi(); ledView(); logView();
}

// ---------- Start ----------
applyI18n();
drawMark(); $('mark').onclick = drawMark;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setFavicon);   // Favicon in den neuen Farben
fillPlotModels(); renderStatus(); renderUpload();
poll(); checkAuth();   // Status ist auch ohne Anmeldung lesbar, die Verbindungsanzeige oben stimmt so von Anfang an
</script>
